name: Build Crazy Cars Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-
            Library-

      - name: Verify Unity activation secrets
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          missing=0
          if [ -z "$UNITY_LICENSE" ]; then echo "::error::UNITY_LICENSE is missing"; missing=1; fi
          if [ -z "$UNITY_EMAIL" ]; then echo "::error::UNITY_EMAIL is missing"; missing=1; fi
          if [ -z "$UNITY_PASSWORD" ]; then echo "::error::UNITY_PASSWORD is missing"; missing=1; fi
          if [ "$missing" -ne 0 ]; then exit 1; fi

          if [[ ! "$UNITY_EMAIL" =~ ^[^@[:space:]]+@[^@[:space:]]+\.[^@[:space:]]+$ ]]; then
            echo "::error::UNITY_EMAIL does not look like a valid email address."
            exit 1
          fi

          if [[ "$UNITY_PASSWORD" =~ [^A-Za-z0-9] ]]; then
            echo "::error::UNITY_PASSWORD contains special characters. GameCI documents known login issues with special characters; use an alphanumeric Unity password for CI."
            exit 1
          fi

          echo "Unity activation secret preflight passed."

      - name: Build APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          androidExportType: androidPackage
          buildMethod: CrazyCars.Editor.CIBuild.BuildAndroid
          allowDirtyBuild: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CrazyCars-Android-APK
          path: build/Android/CrazyCars.apk
          if-no-files-found: error
